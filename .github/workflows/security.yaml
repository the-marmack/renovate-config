# Security analysis — thin caller for the org's reusable CodeQL workflow. It
# owns the triggers and grants the analyze permissions; the reusable workflow
# detects languages at the repo root. This repo has no root go.mod or
# package.json, so the matrix is just `actions` (build-free CodeQL over the
# GitHub Actions workflows). The .github/zizmor.yml config additionally opts
# the actions leg into zizmor.
#
# Pinned to a full commit SHA (tag in the comment); Renovate keeps it fresh.

name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main", "releases/*"]
  schedule:
    - cron: "28 20 * * 4"

# ceiling for the reusable workflow's analyze job
permissions:
  # upload analysis results to code scanning
  security-events: write
  # fetch internal or private CodeQL packs
  packages: read
  # only required for workflows in private repositories
  actions: read
  # check out the repository
  contents: read

jobs:
  analyze:
    uses: the-marmack/github-workflows/.github/workflows/security.yaml@7350928cd5ff2fd5dde4908d9e8b17b2497109cc # main
